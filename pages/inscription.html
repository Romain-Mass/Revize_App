<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/icons/Revize.svg" />
    <title>Insciption</title>
    <link rel="stylesheet" href="/Styles/styles2.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Navigation principale">
        <div>
          <img src="/assets/icons/Revize.svg" alt="Icon" />
          <a href="#accueil" id="Revize" aria-label="Retour à l'accueil">
            Revize
          </a>
        </div>
      </nav>
    </header>
    <form>
      <h2>Créer un compte</h2>
      <div>
        <label for="first-Name">
          Prénom
          <input type="text" name="firstName" id="firstName" />
        </label>
        <label for="email">
          EMAIL
          <input type="email" name="email" id="email" />
        </label>
        <label for="password">
          Password
          <input type="password" name="password" id="password" />
        </label>
      </div>
      <button type="submit">Se connecter</button>
      <a href="/pages/connexion.html">Déjà un compte ?</a>
    </form>
  </body>
</html>
